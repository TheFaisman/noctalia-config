[theme]
mode              = "light"        # dark | light | auto
shell_mode        = "follow"      # follow | dark | light | auto
source            = "custom"     # builtin | wallpaper | community | custom
builtin           = "Kanagawa"    # bundled palette name
community_palette = "Espresso Cream"   # community palette name when source = "community"
custom_palette    = "Tiramissu"   # file name (without .json) when source = "custom"
wallpaper_scheme  = "faithful"  # generator used when source = "wallpaper"
pure_black_dark   = false         # replace dark-mode backgrounds with pure black
